# Netlify configuration — RiskForge v2

# Clean URL: /demo → /demo.html
[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

# Block design-review tools from production crawl (belt-and-braces)
[[redirects]]
  from = "/design-tools/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No-cache HTML so deploys take effect immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
