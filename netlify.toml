# Netlify configuration — RiskForge v3

[build.environment]
  NODE_VERSION = "18"

# Serverless functions: gated sample delivery (register.js + download.js)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean URLs
[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/pci-saq-selector"
  to = "/pci-saq-selector.html"
  status = 200

[[redirects]]
  from = "/nist-maturity-snapshot"
  to = "/nist-maturity-snapshot.html"
  status = 200

# Block design-review tools from production crawl (belt-and-braces)
[[redirects]]
  from = "/design-tools/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No-cache HTML so deploys take effect immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
