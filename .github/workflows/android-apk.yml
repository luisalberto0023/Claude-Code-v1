name: Build Android APK

# Builds an installable debug APK on every push to the game branch, and on
# demand. Download it from the run's "Artifacts" section and share the .apk
# with testers (they enable "Install unknown apps" for their browser/files app).
on:
  push:
    branches: [ "dots-and-boxes-mini-game-app" ]
    paths-ignore: [ "**/*.md" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # STANDALONE=1 skips the service worker — inside a native WebView it's
      # redundant and can cache stale assets. Capacitor serves dist/ locally.
      - name: Build web assets
        run: STANDALONE=1 npx vite build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-grid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
