name: Build Android APK

# Builds an installable debug APK on every push to the game branch, and on
# demand. The APK is uploaded as a run artifact AND published to a stable
# "android-debug" GitHub Release, giving a public direct-download link to
# share with testers (they enable "Install unknown apps" for their browser/
# files app).
on:
  push:
    branches: [ "dots-and-boxes-mini-game-app" ]
    paths-ignore: [ "**/*.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # STANDALONE=1 skips the service worker — inside a native WebView it's
      # redundant and can cache stale assets. Capacitor serves dist/ locally.
      - name: Build web assets
        run: STANDALONE=1 npx vite build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-grid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish to a stable release so testers get a public, login-free link:
      # https://github.com/<owner>/<repo>/releases/download/android-debug/nexus-grid-debug.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nexus-grid-debug.apk
          gh release delete android-debug --yes --cleanup-tag || true
          gh release create android-debug nexus-grid-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Nexus Grid — debug APK" \
            --notes "Latest debug build (commit ${GITHUB_SHA:0:7}). Android only. Enable 'Install unknown apps' for your browser/Files app, then open the APK to install."
