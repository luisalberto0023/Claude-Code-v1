[versions]
agp                 = "8.3.2"
kotlin              = "1.9.24"
ksp                 = "1.9.24-1.0.20"
composeBom          = "2024.05.00"
activityCompose     = "1.9.0"
lifecycleVm         = "2.7.0"
navigationCompose   = "2.7.7"
room                = "2.6.1"
datastore           = "1.1.1"
okhttp              = "4.12.0"
kotlinxJson         = "1.6.3"
kotlinxCoroutines   = "1.8.1"
work                = "2.9.0"
coreKtx             = "1.13.1"

[libraries]
androidx-core-ktx              = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx" }
compose-bom                    = { group = "androidx.compose",         name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended         = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose               = { group = "androidx.activity",        name = "activity-compose",              version.ref = "activityCompose" }
lifecycle-vm-compose           = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleVm" }
lifecycle-runtime-compose      = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",     version.ref = "lifecycleVm" }
navigation-compose             = { group = "androidx.navigation",      name = "navigation-compose",            version.ref = "navigationCompose" }
room-runtime                   = { group = "androidx.room",            name = "room-runtime",                  version.ref = "room" }
room-ktx                       = { group = "androidx.room",            name = "room-ktx",                      version.ref = "room" }
room-compiler                  = { group = "androidx.room",            name = "room-compiler",                 version.ref = "room" }
datastore-prefs                = { group = "androidx.datastore",       name = "datastore-preferences",         version.ref = "datastore" }
okhttp                         = { group = "com.squareup.okhttp3",     name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",     name = "logging-interceptor",           version.ref = "okhttp" }
kotlinx-json                   = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",    version.ref = "kotlinxJson" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",    version.ref = "kotlinxCoroutines" }
work-runtime-ktx               = { group = "androidx.work",            name = "work-runtime-ktx",              version.ref = "work" }

[plugins]
android-application   = { id = "com.android.application",              version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
